name: Accessibility side-by-side
# Measures GOV.UK and ONS pages with the same script used on this site's pages
# (scripts/a11y_benchmark.py), so docs/benchmark-comparison.md Part 4 can be repeated.
on:
  push:
    paths: ["scripts/a11y_benchmark.py", ".github/workflows/a11y-benchmark.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    # Playwright 1.56 has no browser build for Ubuntu 26.04, which is ubuntu-latest now
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make build
      - name: This site
        run: .venv/bin/python scripts/a11y_benchmark.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: GOV.UK and ONS
        run: .venv/bin/python scripts/a11y_benchmark.py --benchmarks | tee -a "$GITHUB_STEP_SUMMARY"
