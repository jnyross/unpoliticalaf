name: Publish release notes

# Releases are deliberate checkpoints, separate from main's Vercel deployments.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate notes and publish the tagged release
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require(`${process.env.GITHUB_WORKSPACE}/scripts/release_notes.cjs`);
            await publish({github, context, core});
