name: Publish release notes

# Releases are deliberate checkpoints, separate from main's Vercel deployments.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A version tag can point outside main. Execute only trusted main tools.
          ref: main
          persist-credentials: false
      - name: Generate notes and publish the tagged release
        uses: actions/github-script@v7
        with:
          script: |
            await require("./scripts/release_notes.cjs")({github, context, core});
