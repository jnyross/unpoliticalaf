name: AGENTS.md freshness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agents-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate AGENTS.md repository references
        run: python3 scripts/check_agents.py
      - name: Test freshness validation and negative cases
        run: python3 -m unittest discover -s tests -p test_check_agents.py -v
