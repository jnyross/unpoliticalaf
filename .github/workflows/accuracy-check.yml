name: Accuracy check (random sample)
# Downloads each sampled figure's source again from the publisher and compares
# it with the page. Runs when the sample or the checker changes, when a goal
# audit's fact-checker adds its chosen figures, or by hand.
#
# A pull request merged by auto-merge.yml uses the workflow token, and that
# merge does not start a push workflow. So auto-merge.yml starts this workflow
# itself when a merge touches these files, and after each run it starts this
# workflow for any audit folder that still has a sample but no results.json.
# The schedule below is a backstop only: scheduled runs are sparse on this repo.
on:
  # Main only. This job commits results back to the branch with the default
  # token, and that commit does not start CI, so on a PR branch the head would
  # never get a check run and the PR could never auto-merge.
  push:
    branches: [main]
    paths:
      - "docs/accuracy-check/sample.json"
      - "docs/standins/audits/*/fact-check/sample.json"
      - "scripts/accuracy_check.py"
      - ".github/workflows/accuracy-check.yml"
  workflow_dispatch:
    inputs:
      dir:
        description: "Folder holding sample.json (default docs/accuracy-check)"
        required: false
        default: ""
  schedule:
    # Backstop: every six hours, check any audit folder still waiting for results.
    - cron: "17 */6 * * *"
permissions:
  contents: write
# One run at a time, so two runs cannot both write results.json.
concurrency:
  group: accuracy-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Check each sample
        env:
          DIR: ${{ github.event.inputs.dir }}
          EVENT: ${{ github.event_name }}
        run: |
          dirs="$DIR"
          if [ -z "$dirs" ]; then
            # An audit's fact-check folder that has a sample but no results yet
            for d in docs/standins/audits/*/fact-check; do
              if [ -f "$d/sample.json" ] && [ ! -f "$d/results.json" ]; then dirs="$dirs $d"; fi
            done
          fi
          # The scheduled run only handles audit folders; with none waiting it does nothing.
          if [ -z "$dirs" ] && [ "$EVENT" != "schedule" ]; then dirs="docs/accuracy-check"; fi
          echo "$dirs" > /tmp/dirs
          for d in $dirs; do python3 scripts/accuracy_check.py check --dir "$d"; done
      - name: Commit results
        run: |
          git config user.name "unpolitical-fetch"
          git config user.email "actions@users.noreply.github.com"
          for d in $(cat /tmp/dirs); do git add "$d/results.json"; done
          if git diff --cached --quiet; then
            echo "No results to commit"
            exit 0
          fi
          git commit -m "Accuracy check: results from the publishers' files ($(date -u +%F))"
          # Another merge may have landed on main while the checks ran.
          git pull --rebase -q origin main
          git push
