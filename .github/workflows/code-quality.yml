name: Code quality metrics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    # The full build/check/494-test coverage run exceeded the former 20 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned quality tools
        run: make -f quality/Makefile setup
      - name: Verify and measure Python quality
        run: make -f quality/Makefile metrics
      - name: Publish metrics in the run summary
        if: always()
        run: |
          for summary in quality-reports/invocation-*/summary.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain dashboard and machine-readable reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-metrics
          path: quality-reports/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
