name: Build and check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make setup
      - name: Measure build and enforce performance budget
        run: make benchmark
      - name: Retain build performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/build-performance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      # Same checks as make verify, without building the site a second time.
      - run: make check test

  accessibility:
    # Playwright 1.56 has no browser build for Ubuntu 26.04, which is ubuntu-latest now
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: make setup-dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make build
      - run: make a11y
