name: Build and check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/release_notes.test.cjs tests/release_workflows.test.cjs

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make verify

  accessibility:
    # Playwright 1.56 has no browser build for Ubuntu 26.04, which is ubuntu-latest now
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make build
      - run: make a11y
