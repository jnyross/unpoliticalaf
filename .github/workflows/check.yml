name: Build and check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The merged full population takes ~11 minutes per process, not the old small suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-architecture.txt
            quality/requirements.txt
      - run: make setup-test
      - name: Measure build and enforce the 90-second budget
        env:
          BUILD_PIP_CACHE_HIT: ${{ steps.python.outputs.cache-hit }}
        run: make benchmark
      - name: Retain build performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/build-performance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Collect a unit test file without running tests
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m pytest --collect-only tests/test_household_shares.py
      # The benchmark and coverage have distinct measurements. Coverage includes
      # a fresh build, independent check and the canonical timed test population.
      - run: make verify-coverage
        if: ${{ !cancelled() }}
      - name: Retain coverage phases and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish combined coverage summary
        if: always()
        run: |
          for summary in quality-reports/invocation-*/summary.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Detect flaky tests with three fresh seeded processes
        if: ${{ !cancelled() }}
        run: make test-stability
      - name: Publish timing and stability summaries
        if: always()
        run: |
          for summary in test-results/*/invocation-*/summary.md test-results/*/invocation-*/run-*/summary.md quality-reports/invocation-*/test-timings/summary.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain original test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

  duplicates:
    name: Duplicate code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:duplicates
      - run: make duplication
      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-code-report
          path: reports/duplication/jscpd-report.json
          retention-days: 14
          if-no-files-found: error

  accessibility:
    # Playwright 1.56 has no browser build for Ubuntu 26.04, which is ubuntu-latest now
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-dev.txt
            requirements-a11y.txt
            requirements-typing.txt
            requirements-architecture.txt
            quality/requirements.txt
      - run: make setup-dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make build
      - run: make a11y

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-dev
      - run: make quality

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make setup-test setup-typing
      - run: make typecheck
      - run: make verify

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-test
      - run: make architecture
