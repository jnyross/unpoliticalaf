name: Build and check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The merged full population takes ~11 minutes per process, not the old small suite.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-test
      - name: Collect a unit test file without running tests
        run: .venv/bin/python -m pytest --collect-only tests/test_household_shares.py
      - run: make verify
      - name: Detect flaky tests with three fresh seeded processes
        run: make test-stability
      - name: Publish timing and stability summaries
        if: always()
        run: |
          for summary in test-results/*/invocation-*/summary.md test-results/*/invocation-*/run-*/summary.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain original test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

  accessibility:
    # Playwright 1.56 has no browser build for Ubuntu 26.04, which is ubuntu-latest now
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make build
      - run: make a11y

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-dev
      - run: make quality

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make setup-test setup-typing
      - run: make typecheck
      - run: make verify
