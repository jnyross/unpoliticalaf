name: Build and check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    needs: flag_configurations
    if: always()
    steps:
      - name: Require every flag configuration to pass
        env:
          RESULT: ${{ needs.flag_configurations.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make verify

  accessibility:
    # Playwright 1.56 has no browser build for Ubuntu 26.04, which is ubuntu-latest now
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make build
      - run: make a11y

  flag_configurations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rollout: static-fallbacks
          - rollout: production
    name: Build and check (${{ matrix.rollout }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - name: Verify static fallbacks
        if: matrix.rollout == 'static-fallbacks'
        env:
          UNPOLITICAL_FEATURE_FLAGS: '{"chart_interactions":false,"sticky_navigation":false}'
        run: make verify
      - name: Verify reviewed production configuration
        if: matrix.rollout == 'production'
        run: make production-verify
