name: Build and check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The full suites run once each, in parallel jobs. The required "check" and
# "quality" aggregates accept only their successful results, so no gate,
# seed or population is dropped by running it outside the aggregate job.
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make delivery

  tracing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  stability:
    name: Seeded stability
    runs-on: ubuntu-latest
    # Three fresh full-population processes take about 25 minutes in CI.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The development set keeps the larger population formerly run by quality.
      - run: make setup-dev
      - name: Detect flaky tests with three fresh seeded processes
        run: make test-stability
      - name: Publish timing and stability summaries
        if: always()
        run: |
          for summary in test-results/*/invocation-*/summary.md test-results/*/invocation-*/run-*/summary.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Retain original test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

  coverage:
    name: Combined coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-dev
      # Coverage includes a fresh build, independent check and the canonical
      # timed test population; it is the measurement in make quality's dashboard.
      - run: make verify-coverage
      - name: Retain coverage phases and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish combined coverage and timing summaries
        if: always()
        run: |
          for summary in quality-reports/invocation-*/summary.md quality-reports/invocation-*/test-timings/summary.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  check:
    runs-on: ubuntu-latest
    needs: [flag_configurations, stability, coverage]
    if: always()
    timeout-minutes: 60
    steps:
      - name: Require every flag configuration, seeded stability and coverage to pass
        id: flags
        env:
          RESULT: ${{ needs.flag_configurations.result }}
          STABILITY: ${{ needs.stability.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: test "$RESULT" = success && test "$STABILITY" = success && test "$COVERAGE" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-architecture.txt
            quality/requirements.txt
      - run: make setup-test
      - name: Measure build and enforce the 90-second budget
        env:
          BUILD_PIP_CACHE_HIT: ${{ steps.python.outputs.cache-hit }}
        run: make benchmark
      - name: Retain build performance metrics
        if: ${{ always() && steps.flags.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/build-performance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Collect a unit test file without running tests
        if: ${{ !cancelled() && steps.flags.outcome == 'success' }}
        run: .venv/bin/python -m pytest --collect-only tests/test_household_shares.py

  duplicates:
    name: Duplicate code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:duplicates
      - run: make duplication
      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-code-report
          path: reports/duplication/jscpd-report.json
          retention-days: 14
          if-no-files-found: error

  accessibility_defaults:
    # Playwright 1.56 has no browser build for Ubuntu 26.04, which is ubuntu-latest now
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-dev.txt
            requirements-a11y.txt
            requirements-typing.txt
            requirements-architecture.txt
            quality/requirements.txt
      - run: make setup-dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make production-build
      - run: make a11y-default
      - name: Exercise browser scanner regressions
        run: RUN_A11Y_BROWSER_TESTS=1 .venv/bin/python -m pytest tests/test_a11y.py

  accessibility_partitions:
    name: Expanded axe partition ${{ matrix.partition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-dev
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make production-build
      - name: Scan assigned manifest paths at both widths
        run: >-
          make a11y-partition
          A11Y_ARGS="--partition-index ${{ matrix.partition }} --partition-count 8
          --output test-results/a11y/partition-${{ matrix.partition }}.json"
      - name: Retain partial evidence even after failure or timeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-axe-${{ matrix.partition }}
          path: test-results/a11y/
          if-no-files-found: error
          retention-days: 30

  accessibility:
    runs-on: ubuntu-24.04
    needs: [accessibility_defaults, accessibility_partitions]
    if: always()
    timeout-minutes: 15
    env:
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-test
      - run: make production-build
      - uses: actions/download-artifact@v4
        with:
          pattern: expanded-axe-*
          path: test-results/a11y-partitions/
      # CI intentionally requires no unresolved incomplete findings. Rendered
      # out-of-band reviews use this same union command with --dispositions;
      # they never turn a missing/failed partition into a successful CI job.
      - name: Require the exact candidate-wide union
        run: >-
          make a11y-union
          A11Y_ARGS="--verify test-results/a11y-partitions/expanded-axe-*/partition-*.json"
      - name: Require default checks and every partition to succeed
        if: always()
        env:
          DEFAULTS: ${{ needs.accessibility_defaults.result }}
          PARTITIONS: ${{ needs.accessibility_partitions.result }}
        run: test "$DEFAULTS" = success && test "$PARTITIONS" = success

  quality:
    runs-on: ubuntu-latest
    # make quality = quality-checks + test-stability + the coverage dashboard.
    # The suites come from the shared jobs above instead of running twice.
    needs: [stability, coverage]
    if: always()
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-dev
      - run: make quality-checks
      - run: make -f quality/Makefile tooling-tests
      - name: Require the shared seeded stability and coverage runs to pass
        if: always()
        env:
          STABILITY: ${{ needs.stability.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: test "$STABILITY" = success && test "$COVERAGE" = success

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make setup-test setup-typing
      - run: make typecheck
      - run: make verify

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-test
      - run: make architecture

  flag_configurations:
    name: Build and check (${{ matrix.rollout }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rollout: both-enhancements
            flags: '{"chart_interactions":true,"sticky_navigation":true}'
          - rollout: charts-only
            flags: '{"chart_interactions":true,"sticky_navigation":false}'
          - rollout: sticky-only
            flags: '{"chart_interactions":false,"sticky_navigation":true}'
          - rollout: static-fallbacks
            flags: '{"chart_interactions":false,"sticky_navigation":false}'
          - rollout: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup-test
      - name: Verify independent local flag combination
        if: matrix.rollout != 'production'
        env:
          UNPOLITICAL_FEATURE_FLAGS: ${{ matrix.flags }}
        run: make verify
      - name: Verify reviewed production configuration
        if: matrix.rollout == 'production'
        run: make production-verify
