[tool.black]
required-version = "25.9.0"
line-length = 100
target-version = ["py310"]
# Retained snapshots/data and generated output are never maintained source.
extend-exclude = '''
^/(reference|data|site|\.factory)/
'''

[tool.pytest.ini_options]
testpaths = ["tests", "quality/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.deptry]
requirements_files = ["requirements.txt", "requirements-a11y.txt"]
requirements_files_dev = ["requirements-dev.txt"]
# Scripts support direct invocation, so sibling imports lack the scripts prefix.
known_first_party = ["user_test", "johns_questions", "standin_score", "source_validation"]
extend_exclude = ["^reference/", "^quality/"]
# quality/ has its own scan: Radon is a runtime import for that developer-only
# entry point, but must not become a production dependency for the static site.
