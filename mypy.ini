[mypy]
python_version = 3.10
files = builder, scripts, tests
show_error_codes = True
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True

# Gradual typing for the existing application; fully check the source-format,
# tax-rate, CSV-export and build-version boundaries, including every function.
[mypy-builder.readers,builder.rates,builder.downloads,builder.version,test_typed_boundaries]
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
disallow_any_generics = True
warn_return_any = True
no_implicit_reexport = True
extra_checks = True

# This dependency ships Python source but no py.typed marker. Analyze that
# source rather than ignoring its import or adding a permissive local stub.
[mypy-axe_playwright_python.*]
follow_untyped_imports = True
